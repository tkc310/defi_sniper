name: diagnose
on:
  push:
    branches: [ci/diagnose]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun --version
      - name: info
        run: |
          { bun info ethers@6.17.0 dependencies; bun info ethers time --json | tail -12; bun info ws time --json | tail -8; bun info ws dist-tags; } 2>&1 | tee info.txt || true
          echo "::warning title=info::$(sed ':a;N;$!ba;s/\n/%0A/g' info.txt)"
