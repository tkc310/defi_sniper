name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # サードパーティ Action もサプライチェーンの一部なので、タグではなくコミット SHA で固定することを推奨
      # (Dependabot / Renovate で SHA の更新 PR を受け取れる)
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # lockfile どおりに入れる。lifecycle script は Bun の既定で実行されない
      - run: bun ci

      - name: Audit dependencies
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      - name: Bundle check (import / syntax errors)
        run: bun build src/commands/**/*.ts --target=bun --outdir=/tmp/bun-build-check
